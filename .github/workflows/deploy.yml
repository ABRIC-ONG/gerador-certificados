name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Instala as dependencias
        run: npm install

      - name: Build do projeto
        run: npm run build

      - name: Deploy no GitHub Pages
        uses: actions/deploy-pages@v1
        with:
          folder: dist # Specify the build folder (where your site files are located)
